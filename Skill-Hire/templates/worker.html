<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HireNow Worker — Mera Kaam</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 48 48%27%3E%3Crect width=%2748%27 height=%2748%27 rx=%2710%27 fill=%27%23101B33%27/%3E%3Crect x=%279%27 y=%2712%27 width=%277%27 height=%2724%27 rx=%271.5%27 fill=%27%23EAF2F7%27/%3E%3Crect x=%279%27 y=%2721%27 width=%2721%27 height=%277%27 rx=%271.5%27 fill=%27%23EAF2F7%27/%3E%3Cpath d=%27M26 20 L33.5 8 L41 20 L37 20 L37 36 L30 36 L30 20 Z%27 fill=%27%23F5A623%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bp-0: #101B33; --bp-1: #182A4A; --bp-2: #223A63;
    --line: #3E6E95; --line-soft: rgba(143,190,220,0.16); --line-bright: #8FCBEF;
    --ink: #EAF2F7; --ink-soft: #93B4CC;
    --safety: #F5A623; --safety-ink: #241804;
    --rust: #E2572B; --rust-tint: rgba(226,87,43,0.16);
    --ok: #58B37C; --ok-tint: rgba(88,179,124,0.16);
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink);
    background-color: var(--bp-0);
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 26px 26px;
    font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: 'Archivo', sans-serif; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  .num { font-family: 'Archivo', sans-serif; font-weight: 800; }
  input, select, button { font-family: inherit; font-size: 14px; color: var(--ink); }
  input, select { background: var(--bp-0); border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 10px; width: 100%; }
  input:focus, select:focus { outline: none; border-color: var(--line-bright); box-shadow: 0 0 0 2px rgba(143,203,239,0.25); }
  button { cursor: pointer; border: none; }

  .tick { position: relative; background: var(--bp-1); border: 1px solid var(--line); border-radius: var(--radius); }
  .tick::before, .tick::after { content: ""; position: absolute; width: 9px; height: 9px; pointer-events: none; border-color: var(--safety); border-style: solid; }
  .tick::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .tick::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  header.topbar {
    background: var(--bp-1); color: var(--ink); padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand .mark { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand h1 { font-size: 18px; }
  .brand h1 .now { color: var(--safety); }
  .who { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--ink-soft); }
  .who button { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); padding: 6px 12px; border-radius: var(--radius); }
  .who button:hover { color: var(--ink); border-color: var(--line-bright); }

  main { max-width: 640px; margin: 0 auto; padding: 22px 16px 60px; }
  #appScreen { opacity: 0; transform: translateY(6px); transition: opacity .5s ease, transform .5s ease; }
  #appScreen.enter { opacity: 1; transform: translateY(0); }

  .auth-wrap { max-width: 380px; margin: 70px auto; padding: 28px; }
  .auth-wrap h2 { font-size: 22px; }
  .auth-wrap p { color: var(--ink-soft); font-size: 13.5px; margin-top: 2px; }
  .auth-wrap .row { margin: 14px 0; }
  .auth-wrap label { font-size: 12.5px; color: var(--ink-soft); display: block; margin-bottom: 5px; }
  .auth-switch { text-align: center; margin-top: 16px; font-size: 13px; color: var(--ink-soft); }
  .auth-switch a { color: var(--line-bright); cursor: pointer; text-decoration: underline; }
  .error-box { background: var(--rust-tint); color: #FFB7A0; border-radius: var(--radius); padding: 9px 11px; font-size: 13px; margin-top: 12px; border: 1px solid rgba(226,87,43,0.4); }
  .field-2 { display: flex; gap: 10px; } .field-2 > div { flex: 1; }

  .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 16px; border-radius: var(--radius); font-size: 13.5px; font-weight: 600; transition: transform .1s ease; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--bp-2); color: var(--ink); border: 1px solid var(--line-bright); }
  .btn-primary:hover { background: #2B5F8F; }
  .btn-outline { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); }
  .btn-outline:hover { color: var(--ink); border-color: var(--line-bright); }
  .btn-safety { background: var(--safety); color: var(--safety-ink); }
  .btn-safety:hover { background: #FFBD5C; }
  .btn-block { width: 100%; }
  .btn[disabled] { opacity: 0.55; cursor: not-allowed; }

  .badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 2px; letter-spacing: 0.01em; }
  .badge.verified { background: var(--ok-tint); color: var(--ok); }
  .badge.pending { background: rgba(242,169,59,0.16); color: var(--safety); }
  .badge.unverified, .badge.rejected { background: var(--rust-tint); color: #FFB7A0; }

  .verify-box { padding: 16px; margin-bottom: 20px; }
  .verify-box .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .verify-box .title { font-weight: 700; }
  .verify-box .sub { font-size: 12.5px; color: var(--ink-soft); }

  .empty { text-align: center; padding: 40px 20px; color: var(--ink-soft); border: 1px dashed var(--line); border-radius: var(--radius); }

  h2.section-title { font-size: 19px; margin-bottom: 12px; }

  .bcard { padding: 17px; margin-bottom: 14px; }
  .bcard-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .bcard-head .name { font-weight: 700; }
  .bcard-head .meta { font-size: 12.5px; color: var(--ink-soft); }
  .bcard-head .num { font-size: 17px; color: var(--safety); }
  .status-pill { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 2px; background: var(--bp-2); color: var(--ink); display: inline-block; margin-bottom: 11px; }

  /* GPS check-in — a location pin that pulses while acquiring a fix, ties motion to the actual wait */
  .gps-note { font-size: 12.5px; color: var(--ink-soft); margin-top: 10px; min-height: 18px; display: flex; align-items: center; gap: 7px; }
  .pin { width: 9px; height: 9px; border-radius: 50%; background: var(--safety); flex-shrink: 0; }
  .pin.locating { animation: pinPulse 1s ease-in-out infinite; }
  @keyframes pinPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: 0.5; } }
  .pin.done { background: var(--ok); }

  /* the one deliberate moment on this page — a stamp confirming a successful check-in */
  .stamp-inline { display: inline-flex; align-items: center; gap: 8px; }
  .stamp-inline .stamp-mini {
    border: 3px solid var(--ok); color: var(--ok); font-family: 'Archivo', sans-serif; font-weight: 900;
    font-size: 12px; letter-spacing: 0.02em; padding: 3px 9px; border-radius: 4px;
    transform: scale(1.8) rotate(-6deg); opacity: 0; animation: stampIn .4s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes stampIn { to { transform: scale(1) rotate(-6deg); opacity: 1; } }

  .chat-toggle { font-size: 12.5px; color: var(--line-bright); text-decoration: underline; cursor: pointer; margin-top: 9px; display: inline-block; }
  .chat-box { display: none; margin-top: 11px; border-top: 1px solid var(--line); padding-top: 11px; }
  .chat-box.open { display: block; }
  .chat-log { max-height: 160px; overflow-y: auto; font-size: 13px; margin-bottom: 8px; }
  .chat-msg { padding: 5px 0; }
  .chat-msg .who { font-size: 11px; color: var(--ink-soft); font-weight: 700; }
  .chat-send { display: flex; gap: 6px; }
  .chat-send input { flex: 1; }
</style>
</head>
<body>

<div id="authScreen" class="auth-wrap tick" style="display:none;">
  <div style="display:flex;justify-content:center;margin-bottom:18px;">
    <svg viewBox="0 0 48 48" width="56" height="56" xmlns="http://www.w3.org/2000/svg"><rect width="48" height="48" rx="10" fill="#101B33"/><rect x="9" y="12" width="7" height="24" rx="1.5" fill="#EAF2F7"/><rect x="9" y="21" width="21" height="7" rx="1.5" fill="#EAF2F7"/><path d="M26 20 L33.5 8 L41 20 L37 20 L37 36 L30 36 L30 20 Z" fill="#F5A623"/></svg>
  </div>
  <h2 id="authTitle" style="text-align:center;">Worker Login</h2>
  <p style="text-align:center;">Apne kaam aur bookings dekhne ke liye login karein</p>

  <div id="loginForm">
    <div class="row"><label>Phone number</label><input type="tel" id="loginPhone" placeholder="9876543210"></div>
    <div class="row"><label>Password</label><input type="password" id="loginPassword"></div>
    <button class="btn btn-safety btn-block" id="loginBtn">Login</button>
    <div class="auth-switch">Naya account? <a id="showRegister">Register karein</a></div>
  </div>

  <div id="registerForm" style="display:none;">
    <div class="row"><label>Naam</label><input type="text" id="regName"></div>
    <div class="row"><label>Phone number</label><input type="tel" id="regPhone"></div>
    <div class="row"><label>Password</label><input type="password" id="regPassword"></div>
    <div class="row field-2">
      <div><label>Skill</label><input type="text" id="regSkill" placeholder="jaise Electrician"></div>
      <div><label>Daily wage (₹)</label><input type="number" id="regWage" placeholder="700"></div>
    </div>
    <div class="row"><label>Shahar</label><input type="text" id="regCity" placeholder="jaise Andheri, Mumbai"></div>
    <button class="btn btn-safety btn-block" id="registerBtn">Account banayein</button>
    <div class="auth-switch">Pehle se account hai? <a id="showLogin">Login karein</a></div>
  </div>
  <div id="authError" class="error-box" style="display:none;"></div>
</div>

<div id="appScreen" style="display:none;">
  <header class="topbar">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 48 48" width="28" height="28" xmlns="http://www.w3.org/2000/svg"><rect width="48" height="48" rx="10" fill="#101B33"/><rect x="9" y="12" width="7" height="24" rx="1.5" fill="#EAF2F7"/><rect x="9" y="21" width="21" height="7" rx="1.5" fill="#EAF2F7"/><path d="M26 20 L33.5 8 L41 20 L37 20 L37 36 L30 36 L30 20 Z" fill="#F5A623"/></svg></span>
      <h1>Hire<span class="now">Now</span></h1>
    </div>
    <div class="who"><span id="whoName"></span><button id="logoutBtn">Logout</button></div>
  </header>

  <main>
    <p style="color:var(--ink-soft);font-size:13px;margin:-6px 0 18px;">Mera Kaam — apne jobs aur bookings yahan dekhein</p>

    <div class="verify-box tick">
      <div class="row">
        <div>
          <div class="title">ID Verification</div>
          <div class="sub">Verified badge se hirers zyada trust karte hain</div>
        </div>
        <span class="badge" id="verifyBadge">—</span>
      </div>
      <div id="verifyUploadArea" style="margin-top:10px;"></div>
    </div>

    <h2 class="section-title">Meri bookings</h2>
    <div id="bookingsList"><div class="empty">Loading...</div></div>
  </main>
</div>

<script>
(function () {
  "use strict";
  var state = { worker: null, bookings: [] };

  function api(path, opts) {
    opts = opts || {};
    if (!(opts.body instanceof FormData)) {
      opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    }
    return fetch(path, opts).then(function (r) {
      return r.json().then(function (data) { return { ok: r.ok, status: r.status, data: data }; });
    });
  }
  function fmtMoney(n) { return "₹" + Number(n).toLocaleString("en-IN"); }
  function fmtDate(d) { var dt = new Date(d + "T00:00:00"); return dt.toLocaleDateString("en-IN", { day: "numeric", month: "short" }); }

  var authScreen = document.getElementById("authScreen");
  var appScreen = document.getElementById("appScreen");
  var authError = document.getElementById("authError");
  function showAuthError(m) { authError.textContent = m; authError.style.display = "block"; }
  function clearAuthError() { authError.style.display = "none"; }

  document.getElementById("showRegister").addEventListener("click", function () {
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("registerForm").style.display = "block";
    document.getElementById("authTitle").textContent = "Worker Registration";
    clearAuthError();
  });
  document.getElementById("showLogin").addEventListener("click", function () {
    document.getElementById("registerForm").style.display = "none";
    document.getElementById("loginForm").style.display = "block";
    document.getElementById("authTitle").textContent = "Worker Login";
    clearAuthError();
  });

  document.getElementById("loginBtn").addEventListener("click", function () {
    clearAuthError();
    api("/api/worker-auth/login", {
      method: "POST",
      body: JSON.stringify({ phone: document.getElementById("loginPhone").value, password: document.getElementById("loginPassword").value })
    }).then(function (res) {
      if (!res.ok) return showAuthError(res.data.error || "Login fail hua");
      startApp(res.data);
    });
  });

  document.getElementById("registerBtn").addEventListener("click", function () {
    clearAuthError();
    api("/api/worker-auth/register", {
      method: "POST",
      body: JSON.stringify({
        name: document.getElementById("regName").value,
        phone: document.getElementById("regPhone").value,
        password: document.getElementById("regPassword").value,
        skill: document.getElementById("regSkill").value,
        city: document.getElementById("regCity").value,
        daily_wage: document.getElementById("regWage").value
      })
    }).then(function (res) {
      if (!res.ok) return showAuthError(res.data.error || "Registration fail hua");
      startApp(res.data);
    });
  });

  document.getElementById("logoutBtn").addEventListener("click", function () {
    api("/api/worker-auth/logout", { method: "POST" }).then(function () {
      appScreen.style.display = "none";
      appScreen.classList.remove("enter");
      authScreen.style.display = "block";
    });
  });

  function startApp(worker) {
    state.worker = worker;
    authScreen.style.display = "none";
    appScreen.style.display = "block";
    requestAnimationFrame(function () { appScreen.classList.add("enter"); });
    document.getElementById("whoName").textContent = worker.name;
    renderVerifyBox();
    loadBookings();
  }

  // ---------------- verification ----------------
  function renderVerifyBox() {
    var badge = document.getElementById("verifyBadge");
    var status = state.worker.verification_status || "unverified";
    badge.textContent = status;
    badge.className = "badge " + status;

    var area = document.getElementById("verifyUploadArea");
    if (status === "verified") { area.innerHTML = ""; return; }
    area.innerHTML =
      '<input type="file" id="idFile" accept=".jpg,.jpeg,.png,.pdf" style="margin-bottom:8px;">' +
      '<button class="btn btn-outline btn-block" id="uploadBtn">ID document upload karein</button>' +
      '<div id="uploadMsg" style="font-size:12px;margin-top:6px;color:var(--ink-soft);"></div>';
    document.getElementById("uploadBtn").addEventListener("click", function () {
      var fileInput = document.getElementById("idFile");
      var msg = document.getElementById("uploadMsg");
      if (!fileInput.files.length) { msg.textContent = "Pehle file chunein."; return; }
      var fd = new FormData();
      fd.append("document", fileInput.files[0]);
      msg.textContent = "Uploading...";
      api("/api/worker/verification/upload", { method: "POST", body: fd }).then(function (res) {
        if (!res.ok) { msg.textContent = res.data.error || "Upload fail hua"; return; }
        state.worker.verification_status = res.data.verification_status;
        msg.textContent = "Upload ho gaya — admin review karega.";
        renderVerifyBox();
      });
    });
  }

  // ---------------- bookings + real GPS check-in ----------------
  var STATUS_LABELS = {
    requested: "Requested", confirmed: "Confirmed", en_route: "Aap ja rahe hain",
    checked_in: "Site par check-in", in_progress: "Kaam chal raha hai", completed: "Poora hua"
  };
  var NEXT_ACTION_LABEL = {
    confirmed: "Nikal raha hoon (check-in)", en_route: "Site pahunch gaya", checked_in: "Kaam shuru karta hoon", in_progress: "Kaam poora hua"
  };

  function loadBookings() {
    api("/api/worker/bookings").then(function (res) {
      state.bookings = res.data || [];
      renderBookings();
    });
  }

  function renderBookings() {
    var wrap = document.getElementById("bookingsList");
    if (!state.bookings.length) { wrap.innerHTML = '<div class="empty">Abhi tak koi booking assign nahi hui.</div>'; return; }
    wrap.innerHTML = state.bookings.map(function (b) {
      var actionLabel = NEXT_ACTION_LABEL[b.status];
      var canAct = b.payment_status === "paid" && actionLabel;
      return (
        '<div class="bcard tick" data-booking="' + b.id + '">' +
          '<div class="bcard-head"><div><div class="name">' + b.hirer_name + '</div>' +
          '<div class="meta">' + fmtDate(b.start_date) + ' · ' + b.days + ' din</div></div>' +
          '<div class="num">' + fmtMoney(b.total_amount) + '</div></div>' +
          '<span class="status-pill">' + STATUS_LABELS[b.status] + (b.payment_status === "paid" ? "" : " · Payment pending") + '</span><br>' +
          (canAct ? '<button class="btn btn-safety" data-checkin="' + b.id + '">' + actionLabel + '</button>' : '') +
          '<div class="gps-note" id="gps-' + b.id + '"></div>' +
          '<span class="chat-toggle" data-chat-toggle="' + b.id + '">Message dekhein / bhejein</span>' +
          '<div class="chat-box" id="chat-' + b.id + '">' +
            '<div class="chat-log" id="chatlog-' + b.id + '"></div>' +
            '<div class="chat-send"><input type="text" id="chatinput-' + b.id + '" placeholder="Message likhein..."><button class="btn btn-primary" data-send="' + b.id + '">Bhejein</button></div>' +
          '</div>' +
        '</div>'
      );
    }).join("");

    wrap.querySelectorAll("[data-checkin]").forEach(function (btn) {
      btn.addEventListener("click", function () { doCheckIn(Number(btn.dataset.checkin)); });
    });
    wrap.querySelectorAll("[data-chat-toggle]").forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.dataset.chatToggle;
        var box = document.getElementById("chat-" + id);
        box.classList.toggle("open");
        if (box.classList.contains("open")) loadMessages(id);
      });
    });
    wrap.querySelectorAll("[data-send]").forEach(function (btn) {
      btn.addEventListener("click", function () { sendMessage(btn.dataset.send); });
    });
  }

  function doCheckIn(bookingId) {
    var note = document.getElementById("gps-" + bookingId);
    if (!navigator.geolocation) {
      note.innerHTML = '<span class="pin" style="background:var(--rust);"></span> Is browser mein location support nahi hai.';
      return;
    }
    note.innerHTML = '<span class="pin locating"></span> Location le rahe hain...';
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        var lat = pos.coords.latitude, lng = pos.coords.longitude;
        note.innerHTML = '<span class="pin locating"></span> Location mil gayi (' + lat.toFixed(4) + ', ' + lng.toFixed(4) + ') — bhej rahe hain...';
        api("/api/worker/bookings/" + bookingId + "/check-in", {
          method: "POST",
          body: JSON.stringify({ latitude: lat, longitude: lng })
        }).then(function (res) {
          if (!res.ok) { note.innerHTML = '<span class="pin" style="background:var(--rust);"></span> ' + (res.data.error || "Kuch galat ho gaya"); return; }
          // the one deliberate moment on this page — a small stamp confirming the check-in landed
          note.innerHTML = '<span class="stamp-inline"><span class="pin done"></span><span class="stamp-mini">DONE</span></span>';
          loadBookings();
        });
      },
      function (err) {
        note.innerHTML = '<span class="pin" style="background:var(--rust);"></span> Location permission nahi mili: ' + err.message + '. Browser settings mein location allow karein.';
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  // ---------------- messaging ----------------
  function loadMessages(bookingId) {
    api("/api/bookings/" + bookingId + "/messages").then(function (res) {
      var log = document.getElementById("chatlog-" + bookingId);
      if (!res.ok) { log.innerHTML = '<div style="color:#FFB7A0;">Messages load nahi hue</div>'; return; }
      if (!res.data.length) { log.innerHTML = '<div style="color:var(--ink-soft);">Koi message nahi hai abhi.</div>'; return; }
      log.innerHTML = res.data.map(function (m) {
        return '<div class="chat-msg"><div class="who">' + (m.sender_role === "worker" ? "Aap" : "Hirer") + '</div>' + m.body + '</div>';
      }).join("");
      log.scrollTop = log.scrollHeight;
    });
  }

  function sendMessage(bookingId) {
    var input = document.getElementById("chatinput-" + bookingId);
    var body = input.value.trim();
    if (!body) return;
    api("/api/bookings/" + bookingId + "/messages", { method: "POST", body: JSON.stringify({ body: body }) }).then(function (res) {
      if (res.ok) { input.value = ""; loadMessages(bookingId); }
    });
  }

  // ---------------- boot ----------------
  api("/api/worker-auth/me").then(function (res) {
    if (res.data.logged_in) startApp(res.data);
    else authScreen.style.display = "block";
  });
})();
</script>
</body>
</html>
